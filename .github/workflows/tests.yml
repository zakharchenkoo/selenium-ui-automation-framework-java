name: UI Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run smoke suite (headless)
        run: >
          mvn -B test
          -Dheadless=true
          -Dsuite.xml.file=src/test/resources/testng-smoke.xml

      - name: Generate Allure report
        if: always()
        run: mvn -B io.qameta.allure:allure-maven:report

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/allure-report

  regression:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run regression suite (headless)
        run: >
          mvn -B test
          -Dheadless=true
          -Dsuite.xml.file=src/test/resources/testng.xml

      - name: Generate Allure report
        if: always()
        run: mvn -B io.qameta.allure:allure-maven:report

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-regression
          path: target/allure-report